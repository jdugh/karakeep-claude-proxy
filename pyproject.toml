[project]
name = "karakeep-claude-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy exposing a Claude Code subscription (claude -p) as a backend for Karakeep tagging/summaries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "openai>=1.40,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: real calls to Claude Code, requires RUN_CLAUDE_INTEGRATION_TESTS=1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
